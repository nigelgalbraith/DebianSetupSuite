<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Page metadata -->
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>{{TITLE}}</title>

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Favicon -->
    <link rel="icon" href="images/favicon/favicon.ico">
</head>
<body>
    <!-- Main content -->
    <div class="container">
        <!-- Report title -->
        <h1>{{TITLE}}</h1>

        <!-- Service check results -->
        <table class="checks">
            <thead>
                <tr>
                    <th>Service</th>
                    <th>Status</th>
                    <th>Message</th>
                    <th>Last Run</th>
                </tr>
            </thead>
            <tbody>
                {{CHECKS}}
            </tbody>
        </table>
    </div>
</body>
</html>
